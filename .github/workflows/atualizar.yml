name: Atualizar layout

# Roda pelo botão "Run workflow" na aba Actions (funciona no iPhone pelo navegador).
# Pega os dados do index.html atual, aplica o template.html e grava o novo index.html.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar o template novo
        run: python convert.py --template template.html --atual index.html --saida index.html
      - name: Gravar o index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "Nada mudou." || git commit -m "Atualiza layout do painel"
          git push
