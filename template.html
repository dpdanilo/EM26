<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="build" content="__BUILD__">
<title>Painel eleitoral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--txt:#2a3441;--sub:#5b6573;--linha:#e2dccf;--linha2:#efe9dc;--acento:#3b6f8f;--acento-tx:#fffdf8;--sel:#c96a3a;--ruim:#b0412e;--bom:#2f7d4f;--chip:#e8e2d4;--ok-bg:#dcefe3;--ok-tx:#1f5e3a;--neutro-bg:#ece8df;color-scheme:light}
:root[data-theme="dark"]{--bg:#1c2229;--card:#252c35;--txt:#ebe6dc;--sub:#a9b2bd;--linha:#38424e;--linha2:#2f3843;--acento:#86b5d3;--acento-tx:#14202a;--sel:#e0905f;--ruim:#f0937f;--bom:#7cc69a;--chip:#323b46;--ok-bg:#24402f;--ok-tx:#a6dcb8;--neutro-bg:#323b46;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{min-height:100vh;display:flex;flex-direction:column}
.cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 32px;background:var(--card);border-bottom:1px solid var(--linha)}
.cab-id{min-width:0;flex:1 1 280px}
.cab-id h1{margin:0;font-size:1.15rem;font-weight:800;overflow-wrap:anywhere}
.cab-id p{margin:2px 0 0;font-size:.78rem;color:var(--sub)}
.abas-topo{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.aba-topo{min-height:44px;padding:0 18px;border:0;border-radius:9px;background:transparent;color:var(--sub)}
.aba-topo[aria-current="page"]{background:var(--card);color:var(--acento);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.btn-icone{width:44px;height:44px;border:1px solid var(--linha);border-radius:22px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.aviso{margin:12px 32px 0;padding:10px 14px;border-radius:10px;background:#fbe7d9;color:#6b2b10;font-size:.9rem}
.conteudo{flex:1;min-height:0}
.tela{width:100%;max-width:1240px;margin:0 auto;padding:24px 32px 40px}
.abas-base{display:none}
/* ---------- Resumo ---------- */
.res-id{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.res-foto{width:88px;height:88px;border-radius:50%;background:var(--chip);color:var(--acento);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.9rem;flex-shrink:0}
.res-id h2{margin:0;font-size:2rem;line-height:1.1}
.res-id p{margin:4px 0 0;color:var(--sub)}
.selos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.selo{font-size:.8rem;font-weight:700;border-radius:12px;padding:4px 12px;background:var(--neutro-bg);color:var(--sub)}
.selo-ok{background:var(--ok-bg);color:var(--ok-tx)}
.grade4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:22px}
.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.cartao{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:18px 20px}
.cartao h3{margin:0 0 8px;font-size:1rem}
.rot{font-size:.82rem;color:var(--sub)}
.num{font-size:2rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.num-destaque{color:var(--acento)}
.var{display:flex;align-items:center;gap:4px;font-size:.85rem}
.var-ruim{color:var(--ruim)}.var-bom{color:var(--bom)}
.linha-lista{display:flex;justify-content:space-between;gap:12px;min-height:40px;align-items:center;border-bottom:1px solid var(--linha2);font-size:.92rem}
.linha-lista:last-child{border-bottom:0}
.linha-lista b{font-variant-numeric:tabular-nums;white-space:nowrap}
.link-btn{background:none;border:0;padding:0;min-height:44px;color:var(--acento);font-weight:600;text-decoration:underline;text-underline-offset:3px}
button.linha-lista{width:100%;background:none;border:0;border-bottom:1px solid var(--linha2);text-align:left;padding:0}
/* ---------- Geografia ---------- */
.filtros{position:sticky;top:0;z-index:1001;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:8px 0 12px;border-bottom:1px solid var(--linha)}
.niveis{display:flex;gap:6px;flex-wrap:wrap}
.nivel-btn{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--linha);background:var(--card);white-space:nowrap}
.nivel-btn[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:var(--acento-tx);font-weight:700}
.busca{position:relative;flex:1 1 240px;min-width:0}
.busca-caixa{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:0 12px}
.busca-caixa input{flex:1;min-width:0;height:44px;border:0;background:transparent;font-weight:700;outline:none}
.sugestoes{position:absolute;left:0;right:0;top:calc(100% + 4px);margin:0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--linha);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:1002;max-height:340px;overflow:auto}
.sug{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-radius:9px;cursor:pointer}
.sug[aria-selected="true"]{background:var(--chip)}
.sug-tag{font-size:.72rem;font-weight:700;color:var(--acento);width:76px;flex-shrink:0}
.sug-ctx{color:var(--sub);font-size:.85rem}
.seg{display:flex;gap:2px;background:var(--chip);border-radius:11px;padding:3px}
.seg-btn{min-height:40px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--sub);white-space:nowrap}
.seg-btn[aria-pressed="true"]{background:var(--card);color:var(--txt);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.trilha{flex-basis:100%;font-size:.85rem;color:var(--sub);display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.trilha-btn{background:none;border:0;color:var(--acento);min-height:32px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.trilha b{color:var(--txt);padding:0 4px}
.seg-vis{display:none}
.vis{margin-top:28px}
.vis-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.vis-cab h2{margin:0;font-size:1.35rem;line-height:1.2}
.vis-sub{margin:4px 0 0;font-size:.92rem}
.exporta{display:flex;gap:8px}
.exp-btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--linha);background:var(--card);font-size:.85rem}
.vis-corpo{display:flex;flex-wrap:wrap;gap:16px}
.mapa-caixa{flex:1 1 520px;min-width:0;height:460px;position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--linha);background:var(--chip)}
.mapa{position:absolute;inset:0}
.mapa-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--sub);font-size:.9rem}
.legenda{position:absolute;left:10px;bottom:10px;z-index:500;background:var(--card);border-radius:10px;padding:6px 10px;font-size:.75rem;color:var(--sub);display:flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.leg-cor{width:18px;height:10px;display:inline-block}
.barras{flex:1 1 380px;min-width:0;height:460px;overflow:auto;background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:10px 14px}
.barras-nota{font-size:.78rem;color:var(--sub);padding-bottom:6px}
.barra-linha{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 72px;gap:8px;align-items:center;width:100%;min-height:30px;border:0;background:none;text-align:left;padding:2px 4px;border-radius:6px;font-size:.82rem}
.barra-linha:hover{background:var(--linha2)}
.barra-linha.sel{font-weight:800;background:var(--linha2);box-shadow:inset 3px 0 0 var(--sub)}
.barra-nome{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-trilho{position:relative;height:12px}
.barra-fill{position:absolute;top:0;height:12px;border-radius:3px}
.barra-zero{position:absolute;top:-3px;bottom:-3px;left:50%;width:1px;background:var(--sub)}
.barra-val{text-align:right;font-variant-numeric:tabular-nums}
.nota-metodo{margin-top:32px}
.btn-rel{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--acento);background:var(--card);color:var(--acento);display:flex;align-items:center;gap:8px;font-weight:700;flex-shrink:0}
.btn-rel[disabled]{opacity:.6;cursor:progress}
.cab-acoes{display:flex;gap:8px;align-items:center}
.tab-res{width:100%;border-collapse:collapse;font-size:.9rem}
.tab-res th{font-size:.75rem;color:var(--sub);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--linha)}
.tab-res td{padding:6px 4px;border-bottom:1px solid var(--linha2);vertical-align:middle}
.tab-res tr:last-child td{border-bottom:0}
.tab-res .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab-res small{display:block;color:var(--sub);font-size:.75rem}
.tab-res .var{justify-content:flex-end}
.td-btn{background:none;border:0;padding:0;min-height:36px;text-align:left;color:var(--txt);text-decoration:underline;text-decoration-color:var(--linha);text-underline-offset:3px}
.var-igual{color:var(--sub)}
.limpar-btn{margin-left:6px;min-height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--linha);background:var(--card);color:var(--txt);font-size:.8rem}
.trilha-nada{padding:0 4px;font-style:italic}
.rank-cartao{margin-top:16px}
.rank-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.rank-cab h3{margin:0}
.rank-caixa.rank-tudo{max-height:480px;overflow:auto}
.tab-rank .rank-ref td{background:var(--linha2);font-weight:800}
.tab-rank .rank-sep td{text-align:center;color:var(--sub);padding:2px}
.selo-mini{font-size:.68rem;font-weight:700;border-radius:8px;padding:1px 6px;background:var(--ok-bg);color:var(--ok-tx);white-space:nowrap}
.leaflet-container{font:inherit;background:var(--chip)}
/* ---------- Modal ---------- */
.modal-fundo{position:fixed;inset:0;z-index:3000;background:rgba(20,26,33,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);color:var(--txt);border-radius:16px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:20px 24px}
.modal h2{margin:0 0 8px;font-size:1.2rem}
.modal p,.modal li{font-size:.92rem}
/* ---------- Celular: tela única, sem rolagem da página ---------- */
@media (max-width:760px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .app{height:100vh;height:100dvh;min-height:0}
  .cab{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));gap:6px;flex-wrap:nowrap}
  .cab-id h1{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cab-id p{font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .abas-topo{display:none}
  .aviso{margin:8px 12px 0}
  .conteudo{overflow:hidden;display:flex;flex-direction:column}
  .tela{padding:12px 14px;flex:1;min-height:0}
  #tela-resumo{overflow:auto;-webkit-overflow-scrolling:touch}
  #tela-geo{display:flex;flex-direction:column;overflow:hidden;gap:8px}
  .res-foto{width:60px;height:60px;font-size:1.3rem}
  .res-id h2{font-size:1.4rem}
  .grade4{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
  .grade2{grid-template-columns:1fr;gap:8px;margin-top:8px}
  .cartao{padding:12px 14px}
  .num{font-size:1.5rem}
  .filtros{position:static;padding:0;border:0;gap:8px}
  .niveis{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  .nivel-btn{padding:0 12px;font-size:.85rem}
  .busca{flex-basis:100%}
  .trilha{font-size:.75rem}
  .seg-vis{display:flex}
  .linha-ctrl{display:flex;justify-content:space-between;gap:8px;width:100%}
  .vis{display:none;margin-top:0;flex:1;min-height:0;flex-direction:column}
  .vis.ativa{display:flex}
  .vis-cab{margin-bottom:6px;align-items:flex-start}
  .vis-cab h2{font-size:1rem}
  .vis-sub{font-size:.8rem}
  .exporta{gap:4px}
  .exp-btn{padding:0 8px;font-size:.75rem}
  .vis-corpo{flex:1;min-height:0;flex-direction:column;flex-wrap:nowrap;gap:8px}
  .mapa-caixa{flex:0 0 42%;height:auto}
  .barras{flex:1;height:auto;min-height:0}
  .barra-linha{grid-template-columns:minmax(0,110px) minmax(0,1fr) 56px}
  .abas-base{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));flex-shrink:0;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--linha)}
  .aba-base{border:0;background:transparent;color:var(--sub);font-size:.75rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:44px}
  .aba-base[aria-current="page"]{color:var(--acento);font-weight:800}
  .nota-metodo{margin-top:12px}
  .btn-rel{width:44px;padding:0;justify-content:center}
  .btn-rel-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .mob-oculta{display:none}
  .tab-res{font-size:.85rem}
}
@media (min-width:761px){.linha-ctrl{display:contents}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="cab">
    <div class="cab-id"><h1 id="cab-nome">Painel eleitoral</h1><p id="cab-sub"></p></div>
    <nav class="abas-topo" aria-label="Abas">
      <button class="aba-topo" data-aba="resumo" aria-current="page">Resumo Geral</button>
      <button class="aba-topo" data-aba="geo">Geografia da Votação</button>
    </nav>
    <div class="cab-acoes">
      <button id="btn-resumido" class="btn-rel" aria-label="Gerar relatório resumido em PDF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h8"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg>
        <span class="btn-rel-txt">Relatório resumido</span>
      </button>
      <button id="btn-relatorio" class="btn-rel" aria-label="Gerar relatório completo em PDF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M12 12v6M9 15l3 3 3-3"></path></svg>
        <span class="btn-rel-txt">Relatório completo</span>
      </button>
      <button id="btn-tema" class="btn-icone" aria-label="Trocar tema claro ou escuro">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </button>
    </div>
  </header>
  <div id="aviso-file" class="aviso" hidden>Você abriu o arquivo direto do computador. O mapa do OpenStreetMap só carrega quando a página é aberta por um endereço http ou https (por exemplo, no GitHub Pages).</div>
  <main class="conteudo">
    <section id="tela-resumo" class="tela" aria-label="Resumo Geral"></section>
    <section id="tela-geo" class="tela" aria-label="Geografia da Votação" hidden>
      <div class="filtros">
        <div class="niveis" id="niveis" role="group" aria-label="Nível geográfico"></div>
        <div class="busca">
          <div class="busca-caixa">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <label for="busca" class="sr">Escolher lugar</label>
            <input id="busca" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="sugestoes" aria-expanded="false" placeholder="Digite um lugar">
          </div>
          <ul id="sugestoes" class="sugestoes" role="listbox" hidden></ul>
        </div>
        <div class="linha-ctrl">
          <div class="seg seg-vis" id="seg-vis" role="group" aria-label="Visualização"></div>
          <div class="seg" id="seg-modo" role="group" aria-label="Tipo de número"></div>
        </div>
        <nav class="trilha" id="trilha" aria-label="Caminho"></nav>
      </div>
      <section class="vis ativa" id="vis-v1" aria-labelledby="tit-v1">
        <div class="vis-cab"><div><h2 id="tit-v1"></h2><p class="vis-sub" id="sub-v1"></p></div>
          <div class="exporta"><button class="exp-btn" data-exp="xlsx" data-vis="v1">Excel</button><button class="exp-btn" data-exp="pdf" data-vis="v1">PDF</button><button class="exp-btn" data-exp="png" data-vis="v1">Imagem</button></div></div>
        <div class="vis-corpo">
          <div class="mapa-caixa"><div class="mapa" id="mapa-v1"></div><div class="legenda" id="leg-v1"></div></div>
          <div class="barras" id="barras-v1"></div>
        </div>
      </section>
      <section class="vis" id="vis-v2" aria-labelledby="tit-v2">
        <div class="vis-cab"><div><h2 id="tit-v2"></h2><p class="vis-sub" id="sub-v2"></p></div>
          <div class="exporta"><button class="exp-btn" data-exp="xlsx" data-vis="v2">Excel</button><button class="exp-btn" data-exp="pdf" data-vis="v2">PDF</button><button class="exp-btn" data-exp="png" data-vis="v2">Imagem</button></div></div>
        <div class="vis-corpo">
          <div class="mapa-caixa"><div class="mapa" id="mapa-v2"></div><div class="legenda" id="leg-v2"></div></div>
          <div class="barras" id="barras-v2"></div>
        </div>
      </section>
    </section>
  </main>
  <nav class="abas-base" aria-label="Abas">
    <button class="aba-base" data-aba="resumo" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Resumo Geral</button>
    <button class="aba-base" data-aba="geo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15M15 6v15"></path></svg>Geografia</button>
  </nav>
</div>
<div id="modal" class="modal-fundo" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-tit">
    <h2 id="modal-tit">Como calculamos</h2>
    <div id="modal-corpo"></div>
    <button id="modal-fechar" class="exp-btn">Fechar</button>
  </div>
</div>
<script id="dados" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script id="app">
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('dados').textContent);
  var BUILD = (document.querySelector('meta[name="build"]') || { getAttribute: function () { return ''; } }).getAttribute('content');
  var A0 = D.meta.anos[0], A1 = D.meta.anos[1];

    $('cab-sub').textContent = M.cargo + ' ' + M.uf + ' · ' + A1 + ' × ' + A0 + ' · gerado em ' + BUILD;
    if (location.protocol === 'file:') $('aviso-file').hidden = false;
    var escuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    st.tema = escuro ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', st.tema);
    st.sel = 'uf';
    renderResumo();
    render();
    document.addEventListener('click', aoClicar);
    $('btn-tema').addEventListener('click', function () {
      st.tema = st.tema === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', st.tema);
      if (st.aba === 'geo') renderGeo();
    });
    var inp = $('busca');
    inp.addEventListener('input', function () { abrirSugestoes(buscar(inp.value, U[st.sel].l)); });
    inp.addEventListener('focus', function () { inp.select && inp.select(); });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moverSugestao(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moverSugestao(-1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (!st.sugs.length) abrirSugestoes(buscar(inp.value, U[st.sel].l));
        if (st.sugs.length) selecionar(st.sugs[Math.max(st.sugIdx, 0)].i);
      }
      else if (e.key === 'Escape') { fecharSugestoes(); inp.value = U[st.sel].n; }
    });
    inp.addEventListener('blur', function () { setTimeout(function () { fecharSugestoes(); inp.value = st.destaque || U[st.sel].l === 'uf' ? U[st.sel].n : ''; }, 200); });
    var ul = $('sugestoes');
    var segura = function (e) { if (e.preventDefault) e.preventDefault(); };
    ul.addEventListener('mousedown', segura);
    ul.addEventListener('pointerdown', segura);
    ul.addEventListener('click', function (e) {
      var li = e.target && e.target.closest ? e.target.closest('[data-ir]') : null;
      if (li) { if (e.stopPropagation) e.stopPropagation(); selecionar(li.getAttribute('data-ir')); }
    });
    $('btn-relatorio').addEventListener('click', gerarRelatorio);
    $('btn-resumido').addEventListener('click', gerarResumido);
    $('modal-fechar').addEventListener('click', function () { $('modal').hidden = true; });
    $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) $('modal').hidden = true; });
    $('modal').addEventListener('keydown', function (e) { if (e.key === 'Escape') $('modal').hidden = true; });
    var mq = window.matchMedia && window.matchMedia('(max-width: 760px)');
    if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (st.aba === 'geo') renderGeo(); });
  }

  window.Painel = { st: st, U: U, valor: valor, diferenca: diferenca, irmaos: irmaos, trocarNivel: trocarNivel, montarVis: montarVis,
    textos: textos, buscar: buscar, quebrasQuantil: quebrasQuantil, classeSeq: classeSeq, classeDiv: classeDiv, tabela: tabela,
    exportar: exportar, selecionar: selecionar, abrirModal: abrirModal, render: render, renderGeo: renderGeo,
    montarRelatorio: montarRelatorio, gerarRelatorio: gerarRelatorio, desenharMapa: desenharMapa, regioes: regioes, gruposRanking: gruposRanking, linhasConjunto: linhasConjunto,
    montarResumido: montarResumido, gerarResumido: gerarResumido };
  iniciar();
})();
</script>
